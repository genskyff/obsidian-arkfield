name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4

      - name: Run check
        run: mise run check

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$(jq -r .version manifest.json)" = "$TAG"

      - name: Verify generated theme
        run: |
          mise run build
          git diff --exit-code -- theme.css

      - name: Package theme
        env:
          TAG: ${{ github.ref_name }}
        run: zip "arkfield-$TAG.zip" manifest.json theme.css

      - name: Extract release notes
        run: |
          if [ -f CHANGELOG.md ]; then awk -v header="## [$GITHUB_REF_NAME]" 'index($0, header) == 1 { found = 1; next } found && /^## \[[0-9]/ { exit } found' CHANGELOG.md; fi > notes.md
          [ -s notes.md ] || echo "::warning::CHANGELOG.md 中没有 $GITHUB_REF_NAME 的条目"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            arkfield-*.zip
            manifest.json
            theme.css
          generate_release_notes: true
          fail_on_unmatched_files: true

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4

      - name: Run check
        run: mise run check

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(jq -r .version theme/manifest.json)" = "$TAG"

      - name: Verify generated theme
        run: |
          mise run build
          git diff --exit-code -- theme

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            theme/manifest.json
            theme/theme.css
          generate_release_notes: true
          fail_on_unmatched_files: true
